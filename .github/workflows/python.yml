name: Python 3.13

on:
  push:
    branches:
      - main
      - 'gpt/**'
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python 3.13 sources compile
        run: python -m compileall -q reverse_socks tests
      - name: Install zero dependencies offline and test using only stdlib
        run: |
          python -m venv "$RUNNER_TEMP/nat-node-venv"
          "$RUNNER_TEMP/nat-node-venv/bin/python" -m pip install --no-index --disable-pip-version-check -r requirements.txt
          "$RUNNER_TEMP/nat-node-venv/bin/python" -S -m unittest -v tests.test_dependencies tests.test_protocol
          "$RUNNER_TEMP/nat-node-venv/bin/python" -S -m reverse_socks --help

  cross-language-warp:
    name: RSX2 Go/Python + fake WARP SOCKS5 + DATAGRAM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Build RSX2 Go agent from the companion x-ui PR
        run: |
          git clone --depth 1 --branch gpt/xtcp-reverse-socks-exit \
            https://github.com/qqq694637644/x-ui.git "$RUNNER_TEMP/x-ui"
          cd "$RUNNER_TEMP/x-ui"
          go test -count=1 ./reverseexit ./web/service -run 'TestExitRequiresWARPAndLoopbackOnly|TestWARPHealthProbeChecksTCPAndUDPSeparately|TestManagerTracksXTCPAndWARPIndependently|TestReverseSocksWebConfigSecretsAndLifecycle'
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/x-ui-panel" .
          go build -o "$RUNNER_TEMP/reverse-socks-exit" ./cmd/reverse-socks-exit
      - name: Run real Go/Python + WARP SOCKS5 simulation
        env:
          REVERSE_SOCKS_EXIT_BIN: ${{ runner.temp }}/reverse-socks-exit
        run: python -S -m unittest -v tests.test_dependencies tests.test_protocol tests.test_end_to_end
