name: Python 3.13

on:
  push:
    branches:
      - main
      - 'gpt/**'
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python 3.13 sources compile
        run: python -m compileall -q reverse_socks tests
      - name: Install zero dependencies offline and test using only stdlib
        run: |
          python -m venv "$RUNNER_TEMP/nat-node-venv"
          "$RUNNER_TEMP/nat-node-venv/bin/python" -m pip install --no-index --disable-pip-version-check -r requirements.txt
          "$RUNNER_TEMP/nat-node-venv/bin/python" -S -m unittest -v tests.test_dependencies tests.test_protocol tests.test_scheduler tests.test_logging tests.test_windows_asyncio
          "$RUNNER_TEMP/nat-node-venv/bin/python" -S -m reverse_socks --help

  cross-language-warp:
    name: RSX3-only Go/Python + fake WARP SOCKS5 + DATAGRAM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Build RSX3-only Go agent from the matching Diagnostics PR
        run: |
          git clone --depth 1 --branch gpt/rsx3-diagnostics \
            https://github.com/qqq694637644/x-ui.git "$RUNNER_TEMP/x-ui"
          cd "$RUNNER_TEMP/x-ui"
          go test -count=1 ./reverseexit ./web/service -run 'TestExitRequiresWARPAndLoopbackOnly|TestWARPHealthProbeChecksTCPAndUDPSeparately|TestManagerTracksXTCPAndWARPIndependently|TestReverseSocksWebConfigSecretsAndLifecycle'
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/x-ui-panel" .
          go build -o "$RUNNER_TEMP/reverse-socks-exit" ./cmd/reverse-socks-exit
      - name: Run real Go/Python + WARP SOCKS5 simulation
        env:
          REVERSE_SOCKS_EXIT_BIN: ${{ runner.temp }}/reverse-socks-exit
        run: python -S -m unittest -v tests.test_dependencies tests.test_protocol tests.test_scheduler tests.test_logging tests.test_end_to_end

  real-frps-rsx3:
    name: Official frps 0.69.0 + private frpc x2 + RSX3 + fake WARP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - name: Build matching private frpc XTCP QUIC fork
        run: |
          git clone --depth 1 --branch dev \
            https://github.com/qqq694637644/frp.git "$RUNNER_TEMP/frp"
          cd "$RUNNER_TEMP/frp"
          CGO_ENABLED=0 go build -tags 'frpc,noweb' -o "$RUNNER_TEMP/custom-frpc" ./cmd/frpc
      - name: Download unmodified official frps 0.69.0
        run: |
          curl -fL --retry 3 \
            'https://github.com/fatedier/frp/releases/download/v0.69.0/frp_0.69.0_linux_amd64.tar.gz' \
            -o "$RUNNER_TEMP/frps069.tar.gz"
          mkdir -p "$RUNNER_TEMP/frps069"
          tar -xzf "$RUNNER_TEMP/frps069.tar.gz" -C "$RUNNER_TEMP/frps069"
          "$RUNNER_TEMP/frps069/frp_0.69.0_linux_amd64/frps" --version | grep -F '0.69.0'
      - name: Build matching x-ui Go Exit Agent
        run: |
          git clone --depth 1 --branch gpt/rsx3-diagnostics \
            https://github.com/qqq694637644/x-ui.git "$RUNNER_TEMP/x-ui"
          cd "$RUNNER_TEMP/x-ui"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/reverse-socks-exit" ./cmd/reverse-socks-exit
      - name: Verify true XTCP/QUIC concurrent streams and qlog
        env:
          RSX3_TEST_FRPS_BIN: ${{ runner.temp }}/frps069/frp_0.69.0_linux_amd64/frps
          RSX3_TEST_FRPC_BIN: ${{ runner.temp }}/custom-frpc
          REVERSE_SOCKS_EXIT_BIN: ${{ runner.temp }}/reverse-socks-exit
          RSX3_BULK_BYTES: '1048576'
        run: python -S -m unittest -v tests.test_real_frps_rsx3
      - name: Verify bounded Brutal on both XTCP Proxy and WARP Visitor
        env:
          RSX3_TEST_FRPS_BIN: ${{ runner.temp }}/frps069/frp_0.69.0_linux_amd64/frps
          RSX3_TEST_FRPC_BIN: ${{ runner.temp }}/custom-frpc
          REVERSE_SOCKS_EXIT_BIN: ${{ runner.temp }}/reverse-socks-exit
          RSX3_BULK_BYTES: '1048576'
          RSX3_TEST_BRUTAL: '1'
        run: python -S -m unittest -v tests.test_real_frps_rsx3
      - name: Verify above-64-Mbps Brutal on both XTCP endpoints
        env:
          RSX3_TEST_FRPS_BIN: ${{ runner.temp }}/frps069/frp_0.69.0_linux_amd64/frps
          RSX3_TEST_FRPC_BIN: ${{ runner.temp }}/custom-frpc
          REVERSE_SOCKS_EXIT_BIN: ${{ runner.temp }}/reverse-socks-exit
          RSX3_BULK_BYTES: '1048576'
          RSX3_TEST_BRUTAL: '1'
          RSX3_TEST_BRUTAL_TARGET_MBPS: '128'
          RSX3_TEST_BRUTAL_MAX_MBPS: '192'
          RSX3_TEST_EXTRA_STREAMS: '3'
        run: python -S -m unittest -v tests.test_real_frps_rsx3
