name: Python 3.13

on:
  push:
    branches:
      - main
      - 'gpt/**'
  pull_request:

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q reverse_socks tests
      - run: python -m unittest -v tests.test_protocol
